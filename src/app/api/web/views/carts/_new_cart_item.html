<div class="mt-4 bg-gray-100 p-4 rounded shadow-md">
  <h2 class="text-lg font-semibold text-gray-700 mb-3">Add New Item</h2>
  <form hx-post="/carts/{{ cart.id }}/items" hx-target="#cart-details" hx-swap="innerHTML" class="flex space-x-4 items-center">
    <div>
      <label for="item_id" class="block text-sm font-medium text-gray-700">Item ID</label>
      <input type="text" id="item_id" name="item_id" placeholder="Item ID" class="mt-1 form-input block w-full rounded-md border-gray-300 shadow-sm">
    </div>
    <div>
      <label for="qty" class="block text-sm font-medium text-gray-700">Quantity</label>
      <input type="number" id="qty" name="qty" placeholder="Quantity" class="mt-1 form-input block w-full rounded-md border-gray-300 shadow-sm" min="1">
    </div>
    <button type="submit" class="px-4 py-2 bg-blue-500 text-white font-medium rounded hover:bg-blue-600 focus:outline-none focus:border-blue-700 focus:ring focus:ring-blue-200">Add Item</button>
  </form>
</div>
